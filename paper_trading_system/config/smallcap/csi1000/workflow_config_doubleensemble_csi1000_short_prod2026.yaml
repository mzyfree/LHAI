qlib_init:
  provider_uri: /Users/Dylan.Min/Documents/Code/learn/LHAI/paper_trading_system/data/current
  region: cn
market: csi1000
benchmark: SH000852
data_handler_config: &id001
  start_time: '2021-01-01'
  end_time: '2026-05-18'
  fit_start_time: '2021-01-01'
  fit_end_time: '2024-12-31'
  instruments: csi1000
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 20
      n_drop: 2
  backtest:
    start_time: '2026-01-01'
    end_time: '2026-05-18'
    account: 100000000
    benchmark: SH000852
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
      codes: csi1000
task:
  model:
    class: DEnsembleModel
    module_path: qlib.contrib.model.double_ensemble
    kwargs:
      base_model: gbm
      loss: mse
      num_models: 3
      enable_sr: true
      enable_fs: true
      alpha1: 1
      alpha2: 1
      bins_sr: 10
      bins_fs: 5
      decay: 0.5
      sample_ratios:
      - 0.8
      - 0.7
      - 0.6
      - 0.5
      - 0.4
      sub_weights:
      - 1
      - 1
      - 1
      epochs: 12
      colsample_bytree: 0.8879
      learning_rate: 0.2
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 16
      verbosity: -1
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2021-01-01'
        - '2024-12-31'
        valid:
        - '2025-01-01'
        - '2025-12-31'
        test:
        - '2026-01-01'
        - '2026-05-18'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
