qlib_init:
  provider_uri: /Users/Dylan.Min/Documents/Code/learn/LHAI/paper_trading_system/data/current
  region: cn
market: csi1000
benchmark: SH000852
data_handler_config: &id001
  start_time: '2019-01-01'
  end_time: '2026-05-18'
  fit_start_time: '2019-01-01'
  fit_end_time: '2023-12-31'
  instruments: csi1000
  infer_processors:
  - class: RobustZScoreNorm
    kwargs:
      fields_group: feature
      clip_outlier: true
  - class: Fillna
    kwargs:
      fields_group: feature
  learn_processors:
  - class: DropnaLabel
  - class: CSRankNorm
    kwargs:
      fields_group: label
  label:
  - Ref($close, -2) / Ref($close, -1) - 1
port_analysis_config: &id002
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2026-01-01'
    end_time: '2026-05-18'
    account: 100000000
    benchmark: SH000852
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
      codes: csi1000
task:
  model:
    class: ADARNN
    module_path: qlib.contrib.model.pytorch_adarnn
    kwargs:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0.0
      n_epochs: 200
      lr: 1e-3
      early_stop: 20
      batch_size: 800
      metric: loss
      loss: mse
      GPU: -1
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha360
        module_path: qlib.contrib.data.handler
        kwargs: *id001
      segments:
        train:
        - '2019-01-01'
        - '2023-12-31'
        valid:
        - '2024-01-01'
        - '2025-12-31'
        test:
        - '2026-01-01'
        - '2026-05-18'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *id002
